name: Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  build:
    # This is a *private* build container.
    # See docs/github_actions.md for more information.
    container: ghcr.io/openblack/bw1-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [BW1W100, BW1W110, BW1W120, BW1W130, BW1WCI]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # Caching doesn't save much time and breaks some changesets such as inline header definitions
    # # Restore cached files
    # - name: Cache build
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       build
    #       .ninja_deps
    #       .ninja_log
    #     key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
    #     restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project, link and verify the artifact hashes against
    # config/<version>/build.sha1. Static libs ship in the build container
    # under orig/libs (copied above via /orig), where configure.py reads them
    # verbatim.
    - name: Build
      run: |
        python configure.py --version ${{ matrix.version }}
        ninja all_source build/${{ matrix.version }}/ok

    # Merge queue entries skip the progress report: it dominates the run time,
    # and the pull request and the post-merge push to main produce one anyway.
    - name: Progress report
      if: github.event_name != 'merge_group'
      run: ninja progress build/${{ matrix.version }}/report.json

    # Upload progress report
    - name: Upload report
      if: github.event_name != 'merge_group'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json
