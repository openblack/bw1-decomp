  - source: 0x009BAF0C
  - source: 0x009BAF70
  - source: 0x009BAFDC
# So does the tail of the ".\\scripts\\info*.txt" search pattern.
  - source: 0x009BBDA0
# "LUE\0" ending "DETAIL_CREATURE_INITIAL_DESIRE_SOURCE_VALUE" reads as 0x0045554C, inside
# CameraExclusion::InsideInclusion.
  - source: 0x009BB5FC
# The country code "DEC\0" in getqloc's locale tables reads as 0x00434544, inside LoadIt<GMagicFireBallInfo>.
  - source: 0x00C1F954

